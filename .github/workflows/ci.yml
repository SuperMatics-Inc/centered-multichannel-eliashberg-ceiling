name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source manifests
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          sha256sum -c ADMITTED.sha256
      - name: Manifest covers every tracked file
        run: |
          set -euo pipefail
          git ls-files | grep -vxE 'MANIFEST\.sha256|ADMITTED\.sha256' | sort > tracked.txt
          sed -E 's/^[0-9a-f]{64}  //' MANIFEST.sha256 | sort > manifested.txt
          diff -u manifested.txt tracked.txt
      - name: No review-cycle file in the tree
        run: |
          set -euo pipefail
          if git ls-files | grep -niE '(^|/)reviews?/|review|fix|scoping|\.v1\.'; then exit 1; fi
      - name: Version 1 exact coverings and twelve guarded mutants
        working-directory: replay
        run: |
          set -euo pipefail
          python -B verify.py | tee verify.out
          grep -qF 'Exact endpoint enclosures: 46469427867979/250000000000000 185877711471917/1000000000000000 185891338370617/1000000000000000 92945669185309/500000000000000' verify.out
          grep -qF 'CERTIFIED primary centered cover: reserve=159/500; leaves=159; max_depth=20; area=1; head_intervals=43' verify.out
          grep -qF 'CERTIFIED independent centered cover: reserve=159/500; leaves=466; max_depth=11; area=4/3; head_intervals=43' verify.out
          grep -qF 'PASS: two independent exact coverings and all twelve mutants rejected (each mutant exit 1).' verify.out
          test "$(grep -c '^EXIT: 1 EXPECTED: 1' verify.out)" -eq 12
          test "$(grep -c '^REJECT:' verify.out)" -eq 12
          test "$(grep -c '^EXIT: 0 EXPECTED: 0' verify.out)" -eq 2
      - name: Version 2 exact coverings and twenty guarded mutants
        run: |
          set -euo pipefail
          run_expect() {
            expected=$1
            shift
            set +e
            "$@" > run.out 2>&1
            rc=$?
            set -e
            cat run.out
            test "$rc" -eq "$expected" || { echo "exit $rc, expected $expected: $*"; return 1; }
            if [ "$expected" -eq 1 ] && ! grep -q '^REJECT' run.out; then
              echo "mutant exited 1 without a REJECT line at a guard: $*"
              return 1
            fi
          }
          run_expect 0 python -B records/aniso-close/replay.py
          grep -qF 'EXACT primary three-stage cover: d=3189/10000; leaves=367; depth=24; area=1; heads=43' run.out
          grep -qF 'C_bound = sqrt(6811/5000)/(2*pi)' run.out
          grep -qF 'C_report = sqrt(341/250)/(2*pi)' run.out
          for mutant in budget tail identity denominator cone coverage reserve strict head-divisor ratio-index; do
            run_expect 1 python -B records/aniso-close/replay.py --mutant "$mutant"
          done
          run_expect 0 python -B records/aniso-close/independent.py
          grep -qF 'EXACT independent three-stage cover: d=3189/10000; leaves=1036; depth=13; area=4/3; heads=43' run.out
          grep -qF 'C_bound = sqrt(6811/5000)/(2*pi)' run.out
          grep -qF 'C_report = sqrt(341/250)/(2*pi)' run.out
          for mutant in budget tail identity denominator cone coverage reserve strict head-divisor ratio-index; do
            run_expect 1 python -B records/aniso-close/independent.py --mutant "$mutant"
          done
      - name: Shipped transcript records the same runs
        run: |
          set -euo pipefail
          for line in \
            'EXACT primary three-stage cover: d=3189/10000; leaves=367; depth=24; area=1; heads=43' \
            'EXACT independent three-stage cover: d=3189/10000; leaves=1036; depth=13; area=4/3; heads=43' \
            'C_bound = sqrt(6811/5000)/(2*pi)' \
            'C_report = sqrt(341/250)/(2*pi)' \
            'UNEXPECTED: []' \
            'CHECK_RUNNER_EXIT: 0' \
            'FINAL_VERIFIER_RUNNER_EXIT: 0' \
            'UNRESOLVED_TIME_BUDGET: 3190/10000' \
            '0.9999372823416597'; do
            grep -qF "$line" records/aniso-close/CHECKS.txt || { echo "missing from transcript: $line"; exit 1; }
          done
          for mutant in budget tail identity denominator cone coverage reserve strict head-divisor ratio-index; do
            for program in replay independent; do
              grep -qF -- "aniso-close\\$program.py --mutant $mutant" records/aniso-close/CHECKS.txt \
                || { echo "transcript lacks $program.py $mutant"; exit 1; }
            done
          done
      - name: Pins name thirteen inherited sources
        run: |
          set -euo pipefail
          python -B -c "import json; pins=json.load(open('replay/source-pins.json'))['source_sha256']; assert len(pins)==13; assert all(len(v)==64 for v in pins.values()); print('13 pins')"
      - name: Public prose safeguards
        run: |
          set -euo pipefail
          if grep -nE '—|D:/|C:/|C:\\\\|/scratch/|ceiling-20261118|UNIV-GLUE|OPTIMUM2|\bMac\b|\blane\b|reserved DOI|DOI-PAPER|DOI-SUPP' paper/main.tex README.md CLAIMS.md CITATION.cff records/aniso-close/CHECKS.txt records/aniso-close/RIGOR.md records/aniso-close/replay.py records/aniso-close/independent.py; then exit 1; fi
          grep -qF '10.5281/zenodo.24410276' paper/main.tex
          grep -qF '10.5281/zenodo.24410275' paper/main.tex
          test "$(grep -cF '10.5281/zenodo.24410' paper/main.tex)" -eq 2
          grep -qF 'This preprint has not been peer reviewed.' README.md
          grep -qF 'AI agents generated the proofs, code, and manuscript drafts under D. Rens' README.md
          grep -qF 'Separate AI agents performed the independent reviews.' README.md
          grep -qF 'The floor `0.185411` is a limit of the edge-reserve method' README.md
          grep -qF 'Whether the supremum `S_cent` equals `C_inf` or lies strictly above it is open.' README.md
          grep -qF 'Review records removed from the tree; available in version 1 history' README.md
          if grep -nE '—|D:/|C:/|/scratch/|ceiling-20261118|UNIV-GLUE|OPTIMUM2|\bMac\b|\blane\b' replay/CHECKS.txt records/aniso-close/CHECKS.txt; then exit 1; fi
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: "1795132800"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          test "$(tectonic --version)" = "Tectonic 0.17.0"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the manuscript
        working-directory: paper
        run: |
          set -euo pipefail
          tectonic --keep-logs main.tex
          if grep -nE 'Overfull|Undefined|Citation.*undefined|There were undefined' main.log; then exit 1; fi
          if grep -nE 'Underfull' main.log; then exit 1; fi
          test -s main.pdf
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24410276' urls.txt
          grep -qF 'https://doi.org/10.5281/zenodo.24410275' urls.txt
          test "$(grep -cF 'https://doi.org/10.5281/zenodo.2441027' urls.txt)" -eq 2
          pdfinfo main.pdf | grep -qE '^Pages:[[:space:]]+14$'
          pdftotext main.pdf main.txt
          if grep -nE '—|D:/|C:/|/scratch/|ceiling-20261118|UNIV-GLUE|OPTIMUM2|\bMac\b|\blane\b|DOI-PAPER|DOI-SUPP' main.txt; then exit 1; fi
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'This preprint has not been peer reviewed.'
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'AI agents generated the proofs, code, and manuscript drafts under D. Rens'
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'Separate AI agents performed the independent reviews.'
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'Davis Rens'
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'SuperMatics Inc.'
          tr -s '[:space:]' ' ' < main.txt | grep -qF '0000-0001-5839-5197'
          tr -s '[:space:]' ' ' < main.txt | grep -qF '0.185755024'
          tr -s '[:space:]' ' ' < main.txt | grep -qF '0.185877711'
          tr -s '[:space:]' ' ' < main.txt | grep -qF '9/6820'
          tr -s '[:space:]' ' ' < main.txt | grep -qF '10.5281/zenodo.24410276'
          tr -s '[:space:]' ' ' < main.txt | grep -qF '10.5281/zenodo.24410275'
          sha256sum main.pdf
          md5sum main.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: centered-multichannel-eliashberg-ceiling-paper
          path: |
            paper/main.pdf
            paper/main.log
            paper/main.tex
            paper/refs.bib
            paper/urls.txt
            paper/main.txt
          if-no-files-found: error
